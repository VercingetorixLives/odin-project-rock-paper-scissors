<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Console Rock Paper Scissors</title>
        <style>
            h1, button, p {
                text-align: center;
            }
            div {
                display: flex;
                margin: 10em 0 5em 0;
                gap: 15px;
                justify-content: center;
                align-items: center;
            }
            button {
                height: 100px;
                width: 200px;
                font-size: 36px;
            }
            p {
                font-size: 36px;
                font-weight: 450;
            }
        </style>
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
        <div><button id="rock">Rock</button><button id="paper">Paper</button><button id="scissors">Scissors</button></div>
        <p id="round">Your move, buddy.</p>
        <p id = "game"></p>
    </body>
    <script>
            let score = [0, 0]; //Player, Bot
            let rounds = 1
            let scoreboard = document.querySelector("#game");

            function updateScore() {
                let newScore = ""
                if (rounds < 6) {
                    newScore = "Round " + rounds + "! You: " + score[0] + ", Bot: " + score[1]
                } else {
                    rounds = 1;
                    newScore = "best out of five!";
                    if (score[0] > score[1]) {newScore = "You won " + newScore;} else if (score[0] < score[1]) {newScore = "You lost " + newScore;} else {newScore = "You drawed " + newScore;}
                }
                scoreboard.textContent = newScore;
            }
            updateScore();

            function round(attack) {
                alert("Rock, paper, scissors, shoot!");
                
                let opposition = Math.floor(Math.random()) * 3;
                if (attack == opposition) {
                    alert("It's a draw!");
                } else if ((attack == 0 && opposition == 1) || (attack == 1 && opposition == 2) || (attack == 2 && opposition == 0)) {
                    alert("You lost!");
                    score[1] += 1;
                } else {
                    alert("You win!");
                    score[0] += 1;
                }
                rounds += 1;
                updateScore();
            }

            let rock = document.querySelector("#rock");
            rock.addEventListener("click", () => round(0));
            let paper = document.querySelector("#paper");
            paper.addEventListener("click", () => round(1));
            let scissors = document.querySelector("#scissors");
            scissors.addEventListener("click", () => round(2));


        </script>
</html>
