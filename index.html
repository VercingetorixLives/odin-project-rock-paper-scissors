<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Console Rock Paper Scissors</title>
        <style>
            h1, button {
                text-align: center;
            }
            div {
                display: flex;
                margin: 10em;
                justify-content: center;
                align-items: center;
            }
            button {
                height: 100px;
                width: 200px;
                font-size: 36px;
            }
        </style>
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
        <div><button id="go">Play</button></div>
    </body>
    <script>
            function round() {
                alert("Rock, paper, scissors, shoot!");
                let move = prompt("What's your move?");
                move = move.toLowerCase()
                let attack = -1
                if (move == "rock") {
                    attack = 0;
                } else if (move == "paper") {
                    attack = 1;
                } else if (move == "scissors") {
                    attack = 2;
                } else if (move == "nuke") {
                    alert("Everyone is dead! You win!");
                    return 4
                } else {
                    alert("Not a valid move! Choose rock, paper or scissors.");
                    return 0
                }
                let opposition = Math.floor(Math.random()) * 3;
                if (attack == opposition) {
                    alert("It's a draw!");
                    return 1
                } else if ((attack == 0 && opposition == 1) || (attack == 1 && opposition == 2) || (attack == 2 && opposition == 0)) {
                    alert("You lost!");
                    return 2
                } else {
                    alert("You win!");
                    return 3
                }
            }
            function game() {
                let playerScore = 0
                let botScore = 0
                for (let rounds = 0; rounds < 5; rounds++) {
                    score = round();
                    if (score == 1) {
                        playerScore = playerScore + 0.5;
                        botScore = botScore + 0.5;
                    } else if (score == 2) {
                        botScore = botScore + 1;
                    } else if (score == 3) {
                        playerScore = playerScore + 1;
                    } else if (score == 4) {
                        return
                    } else {
                        rounds = rounds - 1;
                    }
                }
                if (playerScore > botScore) {
                    alert("You won the whole game!");
                } else if (botScore > playerScore) {
                    alert("The bot won the whole game!");
                } else {
                    alert("The whole game was a draw!")
                }
                alert("Final score, you: " + playerScore + ", the machine: " + botScore)
            }
            let playButton = document.getElementById("go");
            playButton.addEventListener("click", game);
        </script>
</html>
